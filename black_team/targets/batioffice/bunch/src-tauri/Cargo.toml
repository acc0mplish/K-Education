[package]
name = "bunch"
version = "0.1.0"
description = "BatiOffice local document shell reimplemented in Tauri + React (bunch)"
authors = []
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
