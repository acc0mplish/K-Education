<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BatiOffice</title>
    <style>
      :root {
        --text: #242424;
        --text-muted: #878e96;
        --border: #e3e6ea;
        --accent: #4b20df;
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: #fff;
      }
      #list {
        height: 100%;
        overflow-y: auto;
        padding: 20px 24px 32px;
      }
      .release {
        padding: 18px 0 6px;
      }
      .release + .release {
        border-top: 1px solid var(--border);
      }
      .release-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 10px;
      }
      .release-version {
        font-size: 16px;
        font-weight: 700;
      }
      .release-date {
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 1px 8px;
      }
      .entry {
        margin: 0 0 12px;
      }
      .entry-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
      }
      .entry-body {
        margin-top: 2px;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-muted);
      }
      #empty {
        display: none;
        padding: 48px 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
      }
    </style>
    <script type="module" crossorigin src="./assets/changelog-SwtuWcnf.js"></script>
  </head>
  <body>
    <div id="list"></div>
    <div id="empty"></div>
  </body>
</html>
