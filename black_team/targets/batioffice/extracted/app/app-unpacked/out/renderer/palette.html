<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Command palette</title>
    <style>
      :root {
        --pal-surface: #ffffff;
        --pal-border: rgba(16, 24, 40, 0.1);
        --pal-text: #101828;
        --pal-muted: #667085;
        --pal-hover: #f4f5f7;
        --pal-accent: #5a4ff0;
        --pal-active: rgba(90, 79, 240, 0.09);
        --pal-shadow:
          0 20px 56px rgba(16, 24, 40, 0.16),
          0 6px 20px rgba(16, 24, 40, 0.08),
          0 1px 3px rgba(16, 24, 40, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --pal-surface: #1f2126;
          --pal-border: rgba(255, 255, 255, 0.1);
          --pal-text: #f2f4f7;
          --pal-muted: #98a2b3;
          --pal-hover: #292c33;
          --pal-accent: #8d84ff;
          --pal-active: rgba(141, 132, 255, 0.16);
          --pal-shadow:
            0 20px 56px rgba(0, 0, 0, 0.5),
            0 6px 20px rgba(0, 0, 0, 0.34),
            0 1px 3px rgba(0, 0, 0, 0.28);
        }
      }
      :root[data-theme='dark'] {
        --pal-surface: #1f2126;
        --pal-border: rgba(255, 255, 255, 0.1);
        --pal-text: #f2f4f7;
        --pal-muted: #98a2b3;
        --pal-hover: #292c33;
        --pal-accent: #8d84ff;
        --pal-active: rgba(141, 132, 255, 0.16);
        --pal-shadow: 0 22px 56px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: transparent;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        color: var(--pal-text);
        /* shadow room: sized so the blur reaches ~zero alpha well before the
           transparent window edge — the cut line must be imperceptible. The
           shadow is offset downward, so the bottom margin is the widest. */
        padding: 40px 48px 64px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .pal,
        .pal.pal-replay {
          animation: pal-pop 150ms cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        @keyframes pal-pop {
          from {
            opacity: 0;
            transform: scale(0.985) translateY(5px);
          }
        }
      }
      .pal {
        display: flex;
        flex-direction: column;
        height: 100%;
        border: 1px solid var(--pal-border);
        border-radius: 16px;
        background: var(--pal-surface);
        box-shadow: var(--pal-shadow);
        overflow: hidden;
      }
      .pal-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--pal-border);
        color: var(--pal-muted);
      }
      .pal-input-row input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--pal-text);
        font-size: 16px;
      }
      .pal-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .pal-section {
        margin: 8px 9px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--pal-muted);
      }
      .pal-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: var(--pal-text);
        font-size: 14px;
        text-align: start;
        cursor: pointer;
      }
      .pal-item .pal-hit {
        color: var(--pal-accent);
        font-weight: 650;
      }
      .pal-item .pal-kind {
        margin-left: auto;
        color: var(--pal-muted);
        font-size: 11.5px;
      }
      .pal-item:hover {
        background: var(--pal-hover);
      }
      .pal-item.selected {
        background: var(--pal-active);
        box-shadow: inset 2.5px 0 0 var(--pal-accent);
      }
      .pal-footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 15px;
        border-top: 1px solid var(--pal-border);
        color: var(--pal-muted);
        font-size: 11px;
      }
      .pal-footer kbd {
        padding: 1px 6px;
        border: 1px solid var(--pal-border);
        border-radius: 5px;
        font-family: inherit;
        font-size: 10.5px;
      }
      .pal-input-row:focus-within {
        box-shadow: inset 0 -1.5px 0 var(--pal-accent);
      }
      .pal-empty {
        padding: 22px 14px;
        color: var(--pal-muted);
        font-size: 13px;
        text-align: center;
      }
    </style>
    <script type="module" crossorigin src="./assets/palette-wrKda2mZ.js"></script>
  </head>
  <body>
    <div class="pal">
      <div class="pal-input-row">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4" />
          <path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <input id="pal-input" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <div id="pal-list" class="pal-list" role="listbox"></div>
      <div class="pal-footer" aria-hidden="true">
        <span><kbd>↑</kbd><kbd>↓</kbd></span>
        <span><kbd>↩</kbd></span>
        <span><kbd>esc</kbd></span>
      </div>
    </div>
  </body>
</html>
