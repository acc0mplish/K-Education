<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BatiOffice Update</title>
    <style>
      :root {
        --accent: #2367ec;
        --accent-hover: #1b58cf;
        --text: #242424;
        --text-muted: #878e96;
        --border: #e3e6ea;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      #hero {
        /* Brand purple, not the generic blue this shipped with: the mark is
           #7B5AF7 and a blue panel behind it read as two different products. */
        background: linear-gradient(135deg, #7b5af7, #4c2fd0);
        padding: 30px 0 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #hero img {
        /* The mark itself, in white — not the app icon. The app icon is a
           rounded white tile, so placing it here put a square inside a square
           and left the glyph looking small and set back inside its own plate.
           brightness(0) invert(1) recolours the flat purple mark to white and
           keeps its alpha. */
        width: 56px;
        height: 56px;
        filter: brightness(0) invert(1);
      }
      #headline {
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #versions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
      }
      #versions .chip {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      #versions .chip.new {
        background: #fff;
        color: var(--accent);
        font-weight: 600;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 22px 28px 20px;
      }
      #desc {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-muted);
        text-align: center;
      }
      #desc.error {
        color: #b3261e;
      }
      /* Release notes. Shown instead of #desc when the feed carried them —
         the generic "performance improvements and bug fixes" sentence exists
         because we had nothing specific to say, so anything specific wins. */
      #notes {
        display: none;
        width: 100%;
        max-height: 300px;
        overflow-y: auto;
        list-style: none;
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--text-muted);
        text-align: left;
        /* The card is draggable; a scrollable list inside it must not drag. */
        -webkit-app-region: no-drag;
        user-select: text;
      }
      #notes li {
        position: relative;
        padding-left: 14px;
      }
      #notes li + li {
        margin-top: 7px;
      }
      #notes li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 8px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #c3c9d2;
      }
      /* The lead change carries the argument for updating now, so it gets the
         weight and its reason; the rest are a list of what else came along. */
      #notes li.lead {
        padding-left: 0;
        margin-bottom: 14px;
      }
      #notes li.lead::before {
        content: none;
      }
      #notes .lead-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.45;
        color: var(--text);
      }
      #notes .lead-detail {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-muted);
      }
      #action {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      #action:hover {
        background: var(--accent-hover);
      }
      #progress {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #progress .track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: #edf1f7;
        overflow: hidden;
      }
      #progress .bar {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #7b5af7, #4c2fd0);
        transition: width 0.2s;
      }
      #progress .label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      #later {
        -webkit-app-region: no-drag;
        background: none;
        border: none;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #later:hover {
        color: var(--text);
      }
    </style>
    <script type="module" crossorigin src="./assets/update-BIRLHDgg.js"></script>
  </head>
